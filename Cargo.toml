[package]
name = "chilpa-pg-spotify"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "Spotify source for Chilpa, inspired by Spotifast"

[[bin]]
name = "plugin"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
rand = "0.9"
protobuf = "3.7.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tiny_http = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "net", "sync", "time"] }
url = "2"
librespot-core = { path = "vendor/librespot/core", default-features = false, features = ["native-tls"] }
librespot-audio = { path = "vendor/librespot/audio", default-features = false, features = ["native-tls"] }
librespot-metadata = { path = "vendor/librespot/metadata", default-features = false }
librespot-protocol = { path = "vendor/librespot/protocol", default-features = false }

[profile.release]
strip = true
debug = 0

[workspace]
exclude = ["vendor/librespot"]
